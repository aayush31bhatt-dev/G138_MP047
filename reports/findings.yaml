# MP047 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G138"          # your group id, e.g. "G042"
problem_id: "MP047"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: "final_price_from_rc_transfer"  # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: "km_driven"                     # the column recorded in a different unit
    group_value: "South"                    # the value of city_zone whose rows are affected
    factor: 0.001                           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: "service_records"
    value: -1                               # the special number typed instead of a blank
    count: 44                               # how many rows have it
  duplicate_rows:
    present: false
    count: null                             # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: "owners"
    start_date: "2026-02-10"                # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-02-23"                  # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: null                             # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: "brand_tier"
    true_levels: 3                          # how many real categories there are after cleaning

tracking:
  experiment_name: "mp047-used-bike-price"
  best_run_id: "08655d95a57c46c4ace4eeedfb7709c4"  # the MLflow run id of your v1 model
  registered_model_name: "mp047-bike-price-model"
  champion_version: 2

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    age_years: 5.4985
    km_driven: 0.0199
    engine_cc: 0.0508
    owners: 0.0001
    service_records: 0.0759
    accidents: 0.0197
  most_drifted_feature: "age_years"
  mae_by_group:            # v1 on later.csv, per value of city_zone
    'North': 16.5066
    'South': 11.1195
    'Central': 11.7433
  worst_served_group: "North"
  mae_v1_on_check: 13.5703  # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: 8.387    # v2 on the same rows
  decision: "promote"       # promote or keep
